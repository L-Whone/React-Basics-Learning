<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
    <style>
      p {
        margin: 0px;
        outline: auto;
        outline-color: pink;
      }

      .landing-page-container {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .website-header {
        font-family: Arial;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .text-inputs-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .input-box {
        padding: 10px;
        border-radius: 5px;
        border-style: solid;
        border-width: 1px;
      }
        .input-box:focus {
          outline-color: rgb(9, 88, 140);
        }

      .password-input-container {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .show-password-button {
        align-items: center;
        font-size: 10px;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 7px;
        padding-right: 7px;
        border-radius: 5px;
        border-style: solid;
        border-width: 1px;
      }

      .auth-buttons-container {
        display: flex;
        gap: 5px;
      }

      .login-button,
      .sign-up-button {
        background-color: rgb(0, 123, 255);
        color: white;
        border-style: none;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function LandingPage() {
        const [showPassword, setShowPassword] = React.useState(false);

        function toggleShowPassword(){
          setShowPassword(!showPassword);
        }
        return (
          <div className="landing-page-container">
            <p className="website-header">Welcome to my Chatbot Website</p>
            <div className="text-inputs-container">
              <div>
                <input placeholder="Email" type="email" className="input-box"/>
              </div>
              <div className="password-input-container">
                  <input placeholder="Password" type={!showPassword ? "password" : "text"} className="input-box"/><br/>
                  <button onClick={toggleShowPassword} className="show-password-button">{!showPassword ? "Show" : "Hide"}</button>
              </div>
            </div>
            <div className="auth-buttons-container">
              <button className="login-button">Login</button>
              <button className="sign-up-button">Sign Up</button>
            </div>
          </div>
        );
      }

      function App()
      {
        return(
          <>
          <LandingPage />
        </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
