<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>

    <style>
      body  {
        margin: 0px;
      }
      button {
        background-color: rgb(25, 135, 84);
        color: white;
        margin: 5px;
        border-style: none;
        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 10px;
        padding-right: 10px;
        cursor: pointer;
      }
      
      .button-holder {
        background-color: rgb(222,222,222);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ClickCounter({count, setCount}) {
        function click() {
          setCount(count+1)
        }

        return (
          <>
            <button onClick={click}>Clicked {count} time{count !== 1 && 's'}</button>
          </>
        )
      }

      function ResetCounter({setCount}) {
        return (
          <>
            <button onClick={() => {setCount(0)}}>Reset</button>
          </>
        )
      }

      function AutoCounter({count, setCount}) {
        const [isRunning, setIsRunning] = React.useState(false);

        React.useEffect(() => {
          if (!isRunning) return;

          const interval = setInterval(() => {
            setCount((count) => count+1)

          }, 1000)

          return () => {
            clearInterval(interval); // executes when dependency changes, before useEffect runs again and on unmount
          }
        }, [isRunning])

        return (
          <>
            <button onClick={() => {setIsRunning(!isRunning)}}>{!isRunning ? "Auto Click" : "Pause Auto"}</button>
          </>
          )
      }
      

      function App()
      {
        const [count, setCount] = React.useState(0);

        function incrementCount() {
          setCount(count+1);
        }

        return(
          <div className="button-holder">
            <ClickCounter count={count} setCount={setCount} />
            <ResetCounter setCount={setCount} />
            <AutoCounter count={count} setCount={setCount} />
          </div>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
