<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      function ClickCounter({count, setCount}) {
        function click() {
          setCount(count+1)
        }

        return (
          <>
            <button onClick={click}>Clicked {count} time{count !== 1 && 's'}</button>
          </>
        )
      }

      function ResetCounter({setCount}) {
        return (
          <>
            <button onClick={() => {setCount(0)}}>Reset</button>
          </>
        )
      }
      

      function App()
      {
        const [count, setCount] = React.useState(0);
        return(
          <>
            <ClickCounter count={count} setCount={setCount} />
            <ClickCounter count={count} setCount={setCount} />
            <ResetCounter setCount={setCount} />
          </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
