<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev@3.2.1/external-library.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input placeholder="Send a message to Chatbot" size="30"/>
            <button>Send</button>
          </>
        );
      }
      
      function ChatMessage({message, imgSource, right}) { // desctructures props right from the get go
        // console.log(props) //looks like a json

        // const message = props.message;
        // const imgSource = props.imgSource;
        // const right = props.right;

        // still requires ChatMessage(props)
        // const {message, imgSource, right} = props; // takes corresponing property out of props
        // destructures props and gives value to corresponing variable

          return (
            <div>
              {right && (
                <img src={imgSource} alt="" width="50"/>
              )}              
              {message}
              {!right && (
                <img src={imgSource} alt="" width="50" />
              )}              
            </div>
          );
      }

      function LandingPage() {
        return (
          <div>
            <p>Welcome to my Chatbot Website</p>
            <div>
              <input placeholder="Enter Email"/>
              </div>
            <div>
              <input placeholder="Enter Password" type="Password"/><br/>
            </div>
            <button>Login</button>
            <button>Sign Up</button>
          </div>
        );
      }

      function App()
      {
        return(
          <>
          <LandingPage />
          <ChatInput />
          <ChatMessage 
            message="textMessage" 
            imgSource="resources\user.png" 
            right={true}
          />
          <ChatMessage 
            message="hello ppop" 
            imgSource="resources\robot.png" 
            right={false}
          />
          <ChatMessage 
            message="peepeepoopoo" 
            imgSource="resources\user.png" 
            right={true}
          />
          <ChatMessage 
            message="amogus" 
            imgSource="resources\robot.png" 
            right={false}
          />
        </>
        )
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
